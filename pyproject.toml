[project]
name = "deepbreath"
version = "0.1.0"
description = "CNN and LLM respiratory sound analysis prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
  "tensorflow==2.21.0",
  "librosa==1.0.0",
  "soundfile==0.14.0",
  "python-dotenv==1.2.2",
  "openai==3.1.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
