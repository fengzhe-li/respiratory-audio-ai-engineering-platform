<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">DeepBreath — End-to-End Inference Pipeline</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Runtime path from an uploaded WAV file to a six-class probability response</text>

  <!-- Step boxes -->
  <g font-size="13.5">
    <rect x="230" y="86" width="300" height="46" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="380" y="114" text-anchor="middle" fill="#1d4ed8" font-weight="600">WAV audio input</text>

    <rect x="230" y="156" width="300" height="54" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="380" y="178" text-anchor="middle" fill="#1d4ed8" font-weight="600">Validation + legacy preprocessing</text>
    <text x="380" y="196" text-anchor="middle" fill="#1d4ed8" font-size="11.5">format check, 6-second pad/clip standardisation</text>

    <rect x="230" y="234" width="300" height="54" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="380" y="256" text-anchor="middle" fill="#1d4ed8" font-weight="600">Mel-spectrogram extraction</text>
    <text x="380" y="274" text-anchor="middle" fill="#1d4ed8" font-size="11.5">librosa defaults, shape 128 x 259 x 1</text>

    <rect x="230" y="312" width="300" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="380" y="334" text-anchor="middle" fill="#047857" font-weight="600">CNN inference</text>
    <text x="380" y="352" text-anchor="middle" fill="#047857" font-size="11.5">saved Keras model, six-unit softmax</text>

    <rect x="230" y="390" width="300" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="380" y="412" text-anchor="middle" fill="#047857" font-weight="600">Structured probability output</text>
    <text x="380" y="430" text-anchor="middle" fill="#047857" font-size="11.5">prediction, confidence, per-class probabilities</text>

    <rect x="230" y="468" width="300" height="46" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="380" y="496" text-anchor="middle" fill="#1d4ed8" font-weight="600">FastAPI JSON response</text>

    <!-- optional branch -->
    <rect x="560" y="384" width="180" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="650" y="408" text-anchor="middle" fill="#b45309" font-weight="600" font-size="12.5">Optional LLM</text>
    <text x="650" y="424" text-anchor="middle" fill="#b45309" font-weight="600" font-size="12.5">reporting layer</text>
    <text x="650" y="440" text-anchor="middle" fill="#b45309" font-size="10.5">POST /report (separate call)</text>
  </g>

  <!-- arrows -->
  <path d="M380,132 L380,156" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M380,210 L380,234" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M380,288 L380,312" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M380,366 L380,390" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M380,444 L380,468" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M530,417 L555,417" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowDash)"/>

  <text x="380" y="546" text-anchor="middle" font-size="11.5" fill="#6b7280">The LLM layer only consumes an existing CNN prediction; it never runs instead of the CNN and is optional at every step.</text>
  <text x="380" y="566" text-anchor="middle" font-size="11.5" fill="#6b7280">Predicted classes: Bronchiectasis, Bronchiolitis, COPD, Healthy, Pneumonia, URTI.</text>
  <text x="380" y="592" text-anchor="middle" font-size="11.5" fill="#9ca3af">Research prototype only — not for medical diagnosis.</text>
</svg>
